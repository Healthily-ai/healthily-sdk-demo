server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Content-hashed JS/CSS bundles + assets -> cache hard.
    location /_expo/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Entry HTML -> always revalidate so redeploys show up.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Runtime config, regenerated per-environment at container start -> never
    # cache, so a redeploy or env change is picked up on the next load.
    location = /env.js {
        add_header Cache-Control "no-cache";
    }

    # Expo Router static export: serve per-route .html, fall back to app shell.
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml font/ttf font/otf font/woff2;
}
